---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name:
      - curl
      - wget
      - git
      - htop
      - ufw
      - fail2ban
      - net-tools
      - iptables-persistent
    state: present

- name: Install Docker
  shell: curl -fsSL https://get.docker.com | VERSION=29.5.2 sh
  args:
    creates: /usr/bin/docker

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Configure UFW - allow SSH
  ufw:
    rule: allow
    port: "22"
    proto: tcp
  tags: ufw

- name: Configure UFW - allow HTTP
  ufw:
    rule: allow
    port: "80"
    proto: tcp
  tags: ufw

- name: Configure UFW - allow HTTPS
  ufw:
    rule: allow
    port: "443"
    proto: tcp
  tags: ufw

- name: Enable UFW
  ufw:
    state: enabled
    policy: deny
  tags: ufw
- name: Save iptables rules
  shell: netfilter-persistent save
  tags: ufw

- name: Enable and start fail2ban
  systemd:
    name: fail2ban
    enabled: yes
    state: started
- name: Configure UFW - allow node-exporter from internal network
  ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: "10.0.1.0/24"
    comment: "node-exporter internal"
  tags: ufw
- name: Configure UFW - allow node-exporter from pod network (Flannel)
  ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: "10.42.0.0/16"
    comment: "node-exporter flannel pod network"
  tags: ufw
- name: SSH hardening - disable password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  tags: ssh
- name: SSH hardening - disable root login with password
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin prohibit-password'
    state: present
  tags: ssh
- name: SSH hardening - enable pubkey authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PubkeyAuthentication'
    line: 'PubkeyAuthentication yes'
    state: present
  tags: ssh
- name: SSH hardening - set max auth tries
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxAuthTries'
    line: 'MaxAuthTries 3'
    state: present
  tags: ssh
- name: SSH hardening - disable X11 forwarding
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?X11Forwarding'
    line: 'X11Forwarding no'
    state: present
  tags: ssh
- name: Restart SSH service
  systemd:
    name: sshd
    state: restarted
  tags: ssh
