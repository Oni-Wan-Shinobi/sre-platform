---
- name: Download fail2ban-telegram script
  get_url:
    url: https://raw.githubusercontent.com/Oni-Wan-Shinobi/fail2ban-telegram/main/fail2ban-telegram.sh
    dest: /tmp/fail2ban-telegram.sh
    mode: '0755'

- name: Run fail2ban-telegram installer
  shell: |
    export TELEGRAM_BOT_TOKEN="{{ fail2ban_telegram_token }}"
    export TELEGRAM_CHAT_ID="{{ telegram_chat_id }}"
    export WHITELIST_IP="{{ whitelist_ip }}"
    bash /tmp/fail2ban-telegram.sh
  args:
    creates: /etc/fail2ban/action.d/telegram.conf
