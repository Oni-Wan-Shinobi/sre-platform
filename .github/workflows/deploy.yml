name: Deploy to k3s

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Helm lint
        run: |
          helm lint helm/n8n --set ingress.enabled=false
          helm lint helm/pgadmin
          helm lint helm/postgres

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Create production values from secrets
        env:
          N8N_VALUES_PROD: ${{ secrets.N8N_VALUES_PROD }}
          PGADMIN_VALUES_PROD: ${{ secrets.PGADMIN_VALUES_PROD }}
          POSTGRES_VALUES_PROD: ${{ secrets.POSTGRES_VALUES_PROD }}
        run: |
          echo "$N8N_VALUES_PROD" > helm/n8n/values-prod.yaml
          echo "$PGADMIN_VALUES_PROD" > helm/pgadmin/values-prod.yaml
          echo "$POSTGRES_VALUES_PROD" > helm/postgres/values-prod.yaml

      - name: Apply SLO rules
        run: kubectl apply -f helm/monitoring/templates/slo-rules.yaml
      - name: Deploy n8n
        run: helm upgrade --install n8n helm/n8n --namespace default --values helm/n8n/values.yaml --values helm/n8n/values-prod.yaml --wait --timeout 120s
      - name: Deploy pgadmin
        run: helm upgrade --install pgadmin helm/pgadmin --namespace default --values helm/pgadmin/values.yaml --values helm/pgadmin/values-prod.yaml --wait --timeout 120s
      - name: Deploy postgres
        run: helm upgrade --install postgres helm/postgres --namespace default --values helm/postgres/values.yaml --values helm/postgres/values-prod.yaml --wait --timeout 120s
      - name: Verify
        run: |
          kubectl rollout status deployment/n8n -n default --timeout=60s
          kubectl rollout status deployment/pgadmin -n default --timeout=60s
          kubectl rollout status statefulset/postgres -n default --timeout=60s
