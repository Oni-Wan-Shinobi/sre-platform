apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: default
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-secret
                      key: s3-access-key
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-secret
                      key: s3-secret-key
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  apk add --no-cache curl wget > /dev/null 2>&1
                  wget -q https://dl.min.io/client/mc/release/linux-arm64/mc -O /usr/local/bin/mc
                  chmod +x /usr/local/bin/mc
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/tmp/dump_${TIMESTAMP}.sql.gz"
                  echo "Starting pg_dump..."
                  pg_dump -h postgres -U {{ .Values.auth.username }} {{ .Values.auth.database }} | gzip > ${BACKUP_FILE}
                  echo "Dump done: $(du -sh ${BACKUP_FILE} | cut -f1)"
                  echo "Uploading to S3..."
                  mc alias set hetzner {{ .Values.backup.s3Endpoint }} ${S3_ACCESS_KEY} ${S3_SECRET_KEY} --api S3v4 > /dev/null
                  mc cp ${BACKUP_FILE} hetzner/{{ .Values.backup.s3Bucket }}/postgres/
                  echo "Upload done"
                  mc find hetzner/{{ .Values.backup.s3Bucket }}/postgres/ --older-than 7d --exec "mc rm {}" 2>/dev/null || true
                  SIZE=$(du -sh ${BACKUP_FILE} | cut -f1)
                  curl -s -X POST "https://api.telegram.org/bot{{ .Values.backup.telegramToken }}/sendMessage" \
                    -d chat_id={{ .Values.backup.telegramChatId }} \
                    -d text="PostgreSQL backup done. File: postgres/dump_${TIMESTAMP}.sql.gz Size: ${SIZE}" > /dev/null
                  echo "Telegram notification sent"
