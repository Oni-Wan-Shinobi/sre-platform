loki:
  commonConfig:
    replication_factor: 1
  auth_enabled: false
  storage:
    type: s3
    s3:
      endpoint: https://fsn1.your-objectstorage.com
      region: fsn1
      s3forcepathstyle: true
      insecure: false
    bucketNames:
      chunks: sre-loki-logs
      ruler: sre-loki-logs
      admin: sre-loki-logs
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

chunksCache:
  enabled: false

resultsCache:
  enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
