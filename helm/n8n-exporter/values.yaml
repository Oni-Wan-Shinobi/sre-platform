replicaCount: 1

image:
  repository: ghcr.io/oni-wan-shinobi/n8n-exporter
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 9101

env:
  N8N_URL: "http://n8n.default.svc.cluster.local:5678"
  N8N_API_KEY: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
