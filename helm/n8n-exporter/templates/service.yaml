apiVersion: v1
kind: Service
metadata:
  name: {{ include "n8n-exporter.fullname" . }}
  labels:
    app: {{ include "n8n-exporter.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 9101
  selector:
    app: {{ include "n8n-exporter.fullname" . }}
