apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "n8n-exporter.fullname" . }}
  labels:
    app: {{ include "n8n-exporter.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "n8n-exporter.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "n8n-exporter.fullname" . }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: n8n-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 9101
          env:
            - name: N8N_URL
              value: {{ .Values.env.N8N_URL | quote }}
            - name: N8N_API_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-exporter-secret
                  key: api-key
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9101
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
