replicaCount: 1

image:
  repository: n8nio/n8n
  pullPolicy: IfNotPresent
  tag: "2.21.8"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 5678

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: n8n.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

env:
  N8N_PORT: "5678"
  N8N_PROTOCOL: "http"
  N8N_HOST: "n8n.local"
  GENERIC_TIMEZONE: "Europe/Helsinki"

persistence:
  enabled: true
  size: 1Gi
  storageClass: "local-path"

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
